name: Site bug
description: Something on the site doesn't work or looks broken
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Link to the page
      description: Copy the address bar where it happens.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. You can drag a screenshot into this box.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For example "Firefox 140 on Windows" or "Safari on iPhone".
    validations:
      required: true
