steps:
  - title: The attack on Castle Rock Pueblo
    date: After 1274, probably early to mid-1280s
    when: 1280
    borders: 1280
    body:
      - Castle Rock Pueblo was part of a cluster of Ancestral Pueblo settlements. Excavations recovered burned structures and the remains of at least 41 people who died during an attack.
      - The latest dated timbers at the site are from 1274. Crow Canyon’s excavation report places the attack probably in the early to mid-1280s. The evidence establishes violence at the site, while who attacked and why remain unresolved.
