steps:
  - title: Tenochtitlan defeats Tlatelolco
    date: "1473"
    when: 1473
    borders: 1473
    body:
      - The neighbouring Mexica cities had grown next to one another on Lake Texcoco. Tenochtitlan’s ruler Axayácatl defeated Tlatelolco under Moquíhuix in 1473.
      - Sources differ on what sparked the fighting. The conquest changed political authority within the twin city and Tlatelolco continued as an important market.
