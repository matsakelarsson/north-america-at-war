steps:
  - title: The destruction of Mayapán
    date: 1441–1460 dating window
    when: 1450
    borders: 1450
    body:
      - Local accounts written down after European arrival remembered a revolt against Mayapán’s rulers. Excavated burials and radiocarbon dates independently place the violence near the time given in these accounts.
      - Researchers link the instability to political rivalry during prolonged drought. Maya communities and political life continued elsewhere in the Yucatán after the capital fell.
