    body:
      - Excavations at Crow Creek identified a fortified village and an attack that killed at least 486 people. Willey and Emerson placed the event around 1325.
      - Material links place the village among communities of the Missouri River region. Competition over land has been proposed as a factor, while the identities and motives of the attackers remain uncertain.
