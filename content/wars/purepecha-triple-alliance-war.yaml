steps:
  - title: Fighting around Taximaroa
    date: Late 1470s
    when: 1478
    borders: 1480
    body:
      - Axayácatl campaigned against the Purépecha state west of the Toluca Valley. Accounts give different dates for fighting around Taximaroa, in the area of present-day Ciudad Hidalgo.
      - The Purépecha retained their independence. Fortifications, settlements and colonial-era accounts show a contested frontier where local communities had their own allegiances. The base map shows the frontier as reconstructed for the decades after this campaign.
